[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MPL-2.0"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
pal-script = { path = "crates/pal-script" }
pal-asset = { path = "crates/pal-asset" }
pal-vm = { path = "crates/pal-vm" }
wgpu = "29"
winit = { version = "0.30", features = ["android-native-activity"] }
pollster = "0.4"
bytemuck = { version = "1.23", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
kira = { version = "=0.12.1", git = "https://github.com/2018wzh/kira.git", rev = "523790dbb7ddea5ca432f375a9f3180923f2ea1e" }
ab_glyph = "0.2"
softbuffer = "0.4.8"
wmv-decoder = { path = "crates/na_wmv_player", default-features = false, features = ["video-only", "audio"] }
plmpeg = { path = "crates/plmpeg" }
